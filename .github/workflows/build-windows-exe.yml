name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.6.0

      - name: Build EXE with PyInstaller (onedir, x64)
        run: |
          pyinstaller --onedir --windowed --name AmazonLabelTool src/main.py

      - name: Package release (x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/AmazonLabelTool_v2.0_x64 | Out-Null
          Copy-Item -Recurse dist/AmazonLabelTool/* release/AmazonLabelTool_v2.0_x64/
          Copy-Item config.production.json release/AmazonLabelTool_v2.0_x64/config.json
          Copy-Item README.md release/AmazonLabelTool_v2.0_x64/
          Compress-Archive -Path release/AmazonLabelTool_v2.0_x64 -DestinationPath release/AmazonLabelTool_v2.0_x64.zip

      - name: Upload artifact (x64)
        uses: actions/upload-artifact@v4
        with:
          name: AmazonLabelTool-Windows-x64
          path: release/AmazonLabelTool_v2.0_x64.zip
          retention-days: 30

  build-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (ARM64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.6.0

      - name: Build EXE with PyInstaller (onedir, ARM64)
        run: |
          pyinstaller --onedir --windowed --name AmazonLabelTool src/main.py

      - name: Package release (ARM64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/AmazonLabelTool_v2.0_arm64 | Out-Null
          Copy-Item -Recurse dist/AmazonLabelTool/* release/AmazonLabelTool_v2.0_arm64/
          Copy-Item config.production.json release/AmazonLabelTool_v2.0_arm64/config.json
          Copy-Item README.md release/AmazonLabelTool_v2.0_arm64/
          Compress-Archive -Path release/AmazonLabelTool_v2.0_arm64 -DestinationPath release/AmazonLabelTool_v2.0_arm64.zip

      - name: Upload artifact (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: AmazonLabelTool-Windows-ARM64
          path: release/AmazonLabelTool_v2.0_arm64.zip
          retention-days: 30
